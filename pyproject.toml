[project]
name = "snowflake-ml-demos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Akre-Fens", email = "bakrefens@chartis.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "keyring>=25.7.0",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "snowflake>=1.14.0",
    "snowflake-connector-python==4.8.0",
    "snowflake-ml-python==2.7.0",
    "snowflake-snowpark-python>=1.56.0",
    "snowflake-telemetry-python>=0.8.0",
    "xgboost==3.2.0",
]

[project.scripts]
snowflake-ml-demos = "snowflake_ml_demos:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
