[project]
name = "snowflake-ml-demos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Akre-Fens", email = "bakrefens@chartis.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "keyring>=25.7.0",
    "snowflake>=1.14.0",
    "snowflake-snowpark-python>=1.56.0",
]

[project.scripts]
snowflake-ml-demos = "snowflake_ml_demos:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
